[pytest]
; Repo root has no setup.py/pyproject.toml, and bite_score/ is a plain
; top-level package directory (not a src/ layout) -- `pythonpath = .` puts
; the repo root on sys.path so `import bite_score` works when pytest is
; invoked from the repo root without needing an editable install.
pythonpath = .
testpaths = tests
